<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plain Language Checker</title>
<style>
  body {
    font-family: Georgia, serif;
    font-size: 17px;
    line-height: 1.7;
    max-width: 1100px;
    margin: 48px auto;
    padding: 0 24px;
    color: #222;
  }
  h1 { font-size: 1.2em; font-weight: normal; color: #666; margin-bottom: 24px; }
  .container { display: flex; gap: 48px; align-items: flex-start; }
  .left { flex: 1; min-width: 0; }
  .right { width: 220px; flex-shrink: 0; padding-top: 4px; }
  textarea {
    width: 100%;
    height: 180px;
    font: inherit;
    border: 1px solid #ccc;
    padding: 12px;
    box-sizing: border-box;
    resize: vertical;
    color: #222;
  }
  textarea:focus { outline: 2px solid #888; border-color: transparent; }
  #output {
    margin-top: 24px;
    padding: 12px;
    min-height: 60px;
    border: 1px solid #eee;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  mark {
    background: #ffe0b2;
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
    cursor: help;
  }
  .long-sent {
    background: #e8f4fb;
    border-bottom: 2px solid #90c8e8;
    cursor: help;
  }
  #status { margin-top: 10px; font-size: 0.85em; color: #888; }
  .stat-block { margin-bottom: 32px; }
  .stat-label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin-bottom: 2px; }
  .stat-value { font-size: 2em; line-height: 1.2; color: #222; }
  .stat-desc { font-size: 0.82em; color: #888; margin-top: 2px; }
</style>
</head>
<body>

<h1>Plain Language Checker</h1>

<div class="container">
  <div class="left">
    <textarea id="input" placeholder="Paste text here…" spellcheck="false"></textarea>
    <div id="status"></div>
    <div id="output"></div>
  </div>
  <div class="right">
    <div class="stat-block">
      <div class="stat-label">Document score</div>
      <div class="stat-value" id="score-val">—</div>
      <div class="stat-desc">of content words with AoA&nbsp;&gt;&nbsp;10</div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Long sentences</div>
      <div class="stat-value" id="long-val">—</div>
      <div class="stat-desc">sentences over 25 words</div>
    </div>
  </div>
</div>

<script>
let aoa = null;
let subtlex = null;
let override = null;

const MIN_CONTENT_WORDS = 20;

document.getElementById('status').textContent = 'Loading word data…';

Promise.all([
  fetch('../data/aoa_lookup.json').then(r => r.json()),
  fetch('../data/subtlex_top10k.json').then(r => r.json()),
  fetch('../data/hos_override.json').then(r => r.json())
])
  .then(([aoaData, subtlexData, overrideData]) => {
    aoa = aoaData;
    subtlex = subtlexData;
    override = overrideData;
    document.getElementById('status').textContent = '';
    const input = document.getElementById('input');
    if (input.value) processInput(input.value);
  })
  .catch(() => {
    document.getElementById('status').textContent =
      'Could not load data files — run via a local server, not file://.';
  });

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function processInput(text) {
  if (!aoa || !subtlex || !override) return;

  let totalFlagged = 0;
  let totalContent = 0;
  let longCount = 0;

  // Split into [sentence, separator, sentence, ...] preserving original whitespace.
  // Separators: whitespace after .!? or newlines.
  const rawParts = text.split(/((?<=[.!?])[ \t]+|\n+)/);

  const html = rawParts.map((part, i) => {
    if (i % 2 === 1) return escapeHtml(part); // separator — preserve as-is

    const wordCount = part.trim().split(/\s+/).filter(Boolean).length;
    const isLong = wordCount > 25;
    if (isLong && part.trim().length > 0) longCount++;

    // Capture word tokens including internal hyphens/apostrophes so "co-operative"
    // and "don't" stay whole for display; even indices are the separators between.
    const tokens = part.split(/([A-Za-z]+(?:['’\-][A-Za-z]+)*)/);
    let firstWordSeen = false;
    const inner = tokens.map((token, j) => {
      if (j % 2 === 0) return escapeHtml(token);
      const isSentenceStart = !firstWordSeen;
      firstWordSeen = true;

      // Principled hyphen splitting: score each component of a compound separately.
      let flaggedTip = null;
      for (const comp of token.split('-')) {
        if (!comp) continue;
        const key = comp.toLowerCase().replace(/['’]/g, '');
        if (!key) continue;

        let score;
        if (key in override) {
          score = override[key];          // domain override always scores
        } else {
          // Proper-noun exclusion: a capitalised word not in the SUBTLEX top 10k
          // is treated as a name and not scored — unless it opens the sentence,
          // where the capital is grammatical rather than a proper noun.
          if (/^[A-Z]/.test(comp) && !isSentenceStart && !(key in subtlex)) continue;
          if (!(key in aoa)) continue;    // not a rated content word
          score = aoa[key];
        }

        totalContent++;
        if (score === null) {
          totalFlagged++;
          if (flaggedTip === null) flaggedTip = 'Specialist term (AoA not rated)';
        } else if (score > 10.0) {
          totalFlagged++;
          if (flaggedTip === null) {
            flaggedTip = `AoA: ${score.toFixed(1)}`;
            const zipfScore = subtlex[key];
            if (zipfScore !== undefined && zipfScore < 4.0) {
              flaggedTip += ` | Zipf: ${zipfScore.toFixed(2)}`;
            }
          }
        }
      }

      return flaggedTip !== null
        ? `<mark title="${flaggedTip}">${escapeHtml(token)}</mark>`
        : escapeHtml(token);
    }).join('');

    return isLong
      ? `<span class="long-sent" title="${wordCount} words">${inner}</span>`
      : inner;
  }).join('');

  document.getElementById('output').innerHTML = html;

  document.getElementById('score-val').textContent = totalContent >= MIN_CONTENT_WORDS
    ? `${(totalFlagged / totalContent * 100).toFixed(1)}%`
    : '—';
  document.getElementById('long-val').textContent = text.trim().length > 0 ? longCount : '—';

  const totalWords = (text.match(/[A-Za-z]+/g) || []).length;
  let status = '';
  if (totalWords > 0) {
    status = `${totalFlagged} of ${totalWords} words flagged (AoA > 10)`;
    if (totalContent > 0 && totalContent < MIN_CONTENT_WORDS) {
      status += ` — too short for a reliable score (needs ${MIN_CONTENT_WORDS}+ content words)`;
    }
  }
  document.getElementById('status').textContent = status;
}

document.getElementById('input').addEventListener('input', e => processInput(e.target.value));
</script>

</body>
</html>
